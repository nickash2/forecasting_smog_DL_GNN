data:
  only_no2: false
  num_vars: 7
  cache_file: no2_dataset_cache.pkl
  force_reload: false
  sample_size: 1.0
  shuffle: true
  ratio:
  - 0.7
  - 0.15
  - 0.15
  smooth_data: false
  smooth_window: 5
model:
  _target_: src.graph_modelling.models.a3tgcn.A3TGCN
  num_nodes: 3
  num_vars: 7
  timesteps: 72
  horizon: 24
  gcn_out_channels: 16
  add_self_loops: true
  improved: true
seed: 34
base_dir: .
results_subdir: comparison_results
training:
  n_lags: 72
  n_horizon: 24
  batch_size: 16
  n_step: 24
  n_epochs: 500
  patience: 5
track_energy: true
optuna:
  enabled: false
  study_name: no2_model_optimization
  storage: sqlite:///no2_models_optuna_4hrs.db
  n_trials: 100
  timeout: 21600
  direction: minimize
paths:
  model_save_name: final_model.pt
  history_save_name: training_history.json
  metrics_save_name: test_metrics.json
  tensorboard_subdir: tensorboard_logs
  plot_subdir: plots
  optuna_subdir: optuna_results

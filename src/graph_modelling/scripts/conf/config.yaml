defaults:
  - data: no2_only          # Default data setting
  - model: spatial_only_gcn # Default model
  - _self_
  - override hydra/launcher: submitit_slurm

# --- General Experiment Settings ---
seed: 34
base_dir: third-copy # Will be set dynamically or use hydra's output dir
results_subdir: "comparison_results" # Subdir within hydra output

# --- Data Loading Parameters ---
data:
  cache_file: "no2_dataset_cache.pkl"
  force_reload: False
  sample_size: 1.0
  shuffle: True
  ratio: [0.7, 0.15, 0.15] # train, val, test split

# --- Training Parameters ---
training:
  n_lags: 72
  n_horizon: 24
  batch_size: 16
  n_step: 24
  n_epochs: 150 # Adjust as needed for quicker comparison runs initially
  patience: 5
  # Learning rate, optimizer etc. could be added here if needed by train_utils

# --- Model Base Parameters (Specifics in model/*.yaml) ---

# --- Paths (relative to base_dir or hydra output) ---
paths:
  model_save_name: "final_model.pt"
  history_save_name: "training_history.json"
  metrics_save_name: "test_metrics.json"
  tensorboard_subdir: "tensorboard_logs"
  plot_subdir: "plots"

# --- Hydra Settings ---
hydra:
  run:
    dir: ${base_dir}/${results_subdir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${base_dir}/${results_subdir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  launcher:
    partition: gpu        # change to your GPU partition
    gpus_per_node: 1      # GPUs per job
    cpus_per_task: 4      # CPUs per job
    nodes: 1              # nodes per job
    timeout_min: 240 #4      # timeout in minutes
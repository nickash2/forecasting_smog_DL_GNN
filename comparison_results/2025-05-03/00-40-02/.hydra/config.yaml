data:
  only_no2: false
  num_vars: 7
  cache_file: no2_dataset_cache.pkl
  force_reload: false
  sample_size: 1.0
  shuffle: true
  ratio:
  - 0.7
  - 0.15
  - 0.15
  smooth_data: false
  smooth_window: 12
  use_time_split: true
  split_dates:
  - '2021-12-31'
  - '2022-12-31'
model:
  _target_: src.graph_modelling.models.temporalonlygnn.SimpleChebGRU
  hidden_channels: 32
  gru_layers: 1
  dropout: 0.2
seed: 34
base_dir: .
results_subdir: comparison_results
training:
  n_lags: 24
  n_horizon: 1
  batch_size: 16
  n_step: 1
  n_epochs: 1000
  patience: 15
track_energy: true
optuna:
  enabled: false
  study_name: no2_model_optimization
  storage: sqlite:///no2_models_optuna_4hrs.db
  n_trials: 100
  timeout: 21600
  direction: minimize
paths:
  model_save_name: final_model.pt
  history_save_name: training_history.json
  metrics_save_name: test_metrics.json
  tensorboard_subdir: tensorboard_logs
  plot_subdir: plots
  optuna_subdir: optuna_results
